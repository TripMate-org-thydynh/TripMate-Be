# Hạ tầng riêng cho e2e — KHÔNG dùng chung với database production.
#
# `.env` trỏ tới Supabase thật mà Render đang chạy. E2E tạo user, chuyến, đơn
# thanh toán và seed còn xoá sạch bảng, nên phải có database riêng.
#
#   npm run test:db:up     # bật Postgres + Redis, đẩy schema, seed dữ liệu test
#   npm run test:e2e:all   # chạy mọi bộ e2e trên hạ tầng này
#   npm run test:db:down   # tắt (dữ liệu vẫn giữ trong volume)
#
# Cổng lệch chuẩn (5433, 6380) để không đụng Postgres/Redis khác trên máy.
services:
  postgres-test:
    # pgvector có sẵn: bảng ai_embeddings dùng kiểu vector(768).
    image: pgvector/pgvector:pg16
    container_name: tripmate-pg-test
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate_test
      POSTGRES_DB: tripmate_test
    ports:
      - '5433:5432'
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripmate -d tripmate_test']
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    container_name: tripmate-redis-test
    ports:
      - '6380:6379'

volumes:
  pg_test_data:
